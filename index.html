<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="{{paper.metadata.description}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{paper.metadata.title}}</title>
    <meta property="og:title" content="{{paper.metadata.title}}" />
    <meta property="og:description" content="{{paper.metadata.description}}" />
    <meta property="og:url" content="{{paper.metadata.url}}" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./static/css/bulma.min.css" />
    <link rel="stylesheet" href="./static/css/bulma-carousel.min.css" />
    <link rel="stylesheet" href="./static/css/bulma-slider.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"
    />
    <link rel="stylesheet" href="./static/css/index.css" />
    <link rel="icon" href="./static/images/favicon.ico" />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
    <script src="./static/js/bulma-carousel.min.js"></script>
    <script src="./static/js/bulma-slider.min.js"></script>
    <script src="./static/js/data.js"></script>
    <script src="./static/js/index.js"></script>
  </head>
  <body>
    <div id="content"></div>
    <div id="lightbox" class="lightbox" aria-hidden="true"><img alt="" /></div>

    <script id="paper-template" type="text/x-handlebars-template">
      {{#if paper.navbar}}
        <nav class="navbar" role="navigation" aria-label="main navigation">
          <div class="navbar-brand">
            <a
              role="button"
              target="_blank"
              class="navbar-burger"
              aria-label="menu"
              aria-expanded="false"
            >
              <span aria-hidden="true"></span>
              <span aria-hidden="true"></span>
              <span aria-hidden="true"></span>
            </a>
          </div>
          <div class="navbar-menu">
            <div
              class="navbar-start"
              style="flex-grow: 1; justify-content: center;"
            >
              <a
                class="navbar-item"
                target="_blank"
                href="{{paper.navbar.home_link}}"
              >
                <span class="icon">
                  <i class="fas fa-home"></i>
                </span>
              </a>

              <div class="navbar-item has-dropdown is-hoverable">
                <a class="navbar-link">More Research</a>
                <div class="navbar-dropdown">
                  {{#each paper.navbar.more_research}}
                    <a class="navbar-item" target="_blank" href="{{link}}">
                      {{name}}
                    </a>
                  {{/each}}
                </div>
              </div>
            </div>
          </div>
        </nav>
      {{/if}}

      <!-- Sticky top bar. -->
      <header class="topbar" id="topbar">
        <div class="topbar-inner">
          <a href="#top" class="topbar-brand">
            <img src="./static/images/cryoDINO_logo.png" alt="" />
            <span>{{paper.metadata.short_title}}</span>
          </a>
          <nav class="topbar-links">
            {{#each paper.nav}}<a href="#{{id}}">{{label}}</a>{{/each}}
          </nav>
        </div>
      </header>

      <section class="hero-modern" id="top">
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="container is-max-widescreen">
          <div class="columns is-vcentered is-variable is-8">
            <div class="column is-7 hero-text reveal">
              {{#if paper.metadata.venue}}<span class="hero-badge">{{paper.metadata.venue}}</span>{{/if}}
              <h1 class="hero-title">
                <img class="hero-logo" src="./static/images/cryoDINO_logo_hero.png" alt="{{paper.metadata.short_title}}" />
              </h1>
              <p class="hero-subtitle">{{paper.metadata.subtitle}}</p>
              {{#if paper.metadata.tagline}}
                <p class="hero-tagline">{{paper.metadata.tagline}}</p>
              {{/if}}
              {{#if (hasItems paper.metadata.stats)}}
                <div class="hero-stats">
                  {{#each paper.metadata.stats}}
                    <div class="stat">
                      <span class="stat-value">{{value}}</span>
                      <span class="stat-label">{{label}}</span>
                    </div>
                  {{/each}}
                </div>
              {{/if}}
              <div class="hero-links">
                {{#each paper.link_items}}
                  <a href="{{link}}" target="_blank" rel="noopener" class="pill-button">
                    <i class="{{icon}}"></i><span>{{name}}</span>
                  </a>
                {{/each}}
                <a href="#authors" class="pill-button is-ghost"><span>Authors</span></a>
                <a href="#citation" class="pill-button is-ghost"><span>BibTeX</span></a>
              </div>
            </div>
            <div class="column is-5 reveal">
              {{#if paper.metadata.hero_video}}
                <div class="hero-media">
                  <video src="{{paper.metadata.hero_video.src}}" autoplay muted loop playsinline></video>
                </div>
                {{#if paper.metadata.hero_video.caption}}<p class="hero-media-caption">{{paper.metadata.hero_video.caption}}</p>{{/if}}
              {{/if}}
            </div>
          </div>
        </div>
      </section>

      {{#if (hasItems paper.content.intros)}}
      <section class="section" id="abstract">
        <div class="container is-max-widescreen">
          <div class="columns is-variable is-6 intro-columns">
            {{#each paper.content.intros}}
              <div class="column reveal">
                {{#if title}}<h2 class="title is-4 block-heading">{{title}}</h2>{{/if}}
                {{#if video}}
                  <div class="media-block reveal">
                    <video src="{{video.src}}" autoplay muted loop playsinline></video>
                    {{#if video.caption}}<p class="content-block-caption">{{video.caption}}</p>{{/if}}
                  </div>
                {{/if}}
                {{#if (hasItems paragraphs)}}
                  <div class="content has-text-justified">
                    {{#each paragraphs}}<p>{{text}}</p>{{/each}}
                  </div>
                {{/if}}
              </div>
            {{/each}}
          </div>
        </div>
      </section>
      {{/if}}

      <!-- Sections (loop). -->
      {{#each paper.content.sections}}
        <section class="section {{#if shaded}}is-shaded{{/if}}" {{#if id}}id="{{id}}"{{/if}}>
          <div class="container is-max-widescreen">
            {{#if title}}<h2 class="title is-3 has-text-centered section-title reveal">{{title}}</h2>{{/if}}

            {{#if diagram}}
              <div class="flow reveal">
                {{#each diagram.steps}}
                  <div class="flow-step">
                    <div class="flow-card">
                      <span class="flow-num">{{inc @index}}</span>
                      <div class="flow-media {{#if fit}}is-{{fit}}{{/if}}">
                        <img src="{{image}}" alt="{{title}}" loading="lazy" />
                      </div>
                      <h3 class="flow-title">{{title}}</h3>
                      <ul class="flow-lines">
                        {{#each lines}}<li>{{this}}</li>{{/each}}
                      </ul>
                      {{#if chip}}<span class="flow-chip">{{chip}}</span>{{/if}}
                    </div>
                  </div>
                {{/each}}
              </div>
              {{#if diagram.legend}}
                <div class="flow-legend reveal">
                  {{#each diagram.legend}}<span><i class="swatch" style="background: {{color}}"></i>{{label}}</span>{{/each}}
                </div>
              {{/if}}
              {{#if diagram.note}}<p class="content-block-caption reveal">{{diagram.note}}</p>{{/if}}
            {{/if}}

            {{#if (eq layout "split")}}
              <div class="columns is-variable is-6 is-vcentered">
                <div class="column is-7">
                  {{#if image}}
                    <div class="media-block reveal">
                      <img src="{{image.src}}" alt="{{#if image.caption}}{{image.caption}}{{else}}{{title}}{{/if}}" loading="lazy" />
                      {{#if image.caption}}<p class="content-block-caption">{{image.caption}}</p>{{/if}}
                    </div>
                  {{/if}}
                </div>
                <div class="column is-5">
                  <div class="content has-text-justified">
                    {{#each paragraphs}}<p>{{text}}</p>{{/each}}
                  </div>
                </div>
              </div>
            {{else}}
              {{#if image}}
                <div class="media-block reveal">
                  <img src="{{image.src}}" alt="{{#if image.caption}}{{image.caption}}{{else}}{{title}}{{/if}}" loading="lazy" />
                  {{#if image.caption}}<p class="content-block-caption">{{image.caption}}</p>{{/if}}
                </div>
              {{/if}}
              {{#if (hasItems paragraphs)}}
                <div class="content has-text-justified section-text reveal">
                  {{#if (eq paragraphStyle "list")}}
                    <ul>{{#each paragraphs}}<li>{{text}}</li>{{/each}}</ul>
                  {{else}}
                    {{#each paragraphs}}<p>{{text}}</p>{{/each}}
                  {{/if}}
                </div>
              {{/if}}
            {{/if}}

            {{#if (hasItems columns)}}
              <div class="columns is-variable is-5 is-vcentered block-columns">
                {{#each columns}}
                  <div class="column reveal {{#if width}}{{width}}{{/if}}">
                    <div class="{{#if card}}info-card{{/if}}">
                      {{#if title}}<h3 class="title is-5">{{title}}</h3>{{/if}}
                      {{#if image}}
                        <div class="media-block reveal">
                          <img src="{{image.src}}" alt="{{#if image.caption}}{{image.caption}}{{else}}{{title}}{{/if}}" loading="lazy" />
                          {{#if image.caption}}<p class="content-block-caption">{{image.caption}}</p>{{/if}}
                        </div>
                      {{/if}}
                      {{#if (hasItems paragraphs)}}
                        <div class="content has-text-justified">
                          {{#each paragraphs}}<p>{{text}}</p>{{/each}}
                        </div>
                      {{/if}}
                    </div>
                  </div>
                {{/each}}
              </div>
            {{/if}}
          </div>
        </section>
      {{/each}}
      <!--/ Sections. -->

      <!-- Conclusion. -->
      {{#if (hasItems paper.content.conclusion.paragraphs)}}
        <section class="section" id="conclusion">
          <div class="container is-max-widescreen">
            <h2 class="title is-3 has-text-centered section-title reveal">{{paper.content.conclusion.title}}</h2>
            <div class="columns is-variable is-5">
              {{#each paper.content.conclusion.paragraphs}}
                <div class="column reveal">
                  <div class="info-card contribution-card">
                    <span class="card-index">0{{inc @index}}</span>
                    <p>{{text}}</p>
                  </div>
                </div>
              {{/each}}
            </div>
          </div>
        </section>
      {{/if}}
      <!--/ Conclusion. -->

      <!-- Authors. -->
      <section class="section is-shaded" id="authors">
        <div class="container is-max-widescreen">
          <h2 class="title is-3 has-text-centered section-title reveal">Authors</h2>
          <div class="author-grid reveal">
            {{#each paper.authors}}
              <div class="author-chip">
                <span class="author-name">{{#if links.website}}<a href="{{links.website}}" target="_blank" rel="noopener">{{name}}</a>{{else}}{{name}}{{/if}}</span><sup>{{affiliation.number}}{{#if equal_contribution}}*{{/if}}{{#if corresponding}}†{{/if}}</sup>
              </div>
            {{/each}}
          </div>
          <p class="author-notes reveal"><sup>*</sup> Equal contribution &nbsp;&nbsp; <sup>†</sup> Corresponding authors</p>
          <ol class="affiliation-list reveal">
            {{#each paper.affiliations}}
              <li><sup>{{number}}</sup>{{name}}</li>
            {{/each}}
          </ol>
        </div>
      </section>
      <!--/ Authors. -->

      <!-- BibTeX. -->
      <section class="section" id="citation">
        <div class="container is-max-widescreen">
          <h2 class="title is-3 has-text-centered section-title reveal">BibTeX</h2>
          <div class="bibtex-box reveal">
            <button class="copy-button" type="button" id="copy-bibtex">Copy</button>
            <pre><code id="bibtex-code">{{paper.bibtex}}</code></pre>
          </div>
        </div>
      </section>
      <!--/ BibTeX. -->

      <!-- Footer. -->
      <footer class="footer">
        <div class="container">
          <div class="content has-text-centered">
            {{#each paper.link_items}}
              <a
                class="icon-link"
                href="{{link}}"
                target="_blank"
                style="margin: 0 10px;"
              >
                <i class="{{icon}} is-small"></i>
              </a>
            {{/each}}
          </div>
          <div class="columns is-centered">
            <div class="column is-8">
              <div class="content">
                <p>
                  This page was built using the
                  <a
                    href="https://github.com/tonyh2021/papers"
                    target="_blank"
                  >Papers</a>
                  which was inspired by the
                  <a
                    href="https://nerfies.github.io/"
                    target="_blank"
                  >Nerfies</a>. You are free to borrow the of this website, we
                  just ask that you link back to this page in the footer.
                </p>
                <p>
                  This website is licensed under a
                  <a
                    rel="license"
                    href="http://creativecommons.org/licenses/by-sa/4.0/"
                    target="_blank"
                  >Creative Commons Attribution-ShareAlike 4.0 International
                    License</a>.
                </p>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </script>
  </body>
</html>
